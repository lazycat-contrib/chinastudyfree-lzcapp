params:
  - id: llm_base_url
    type: string
    name: "LLM Base URL"
    description: "OpenAI-compatible API base URL for online AI features (leave empty to use offline pre-generated content)"
    default_value: "https://api.openai.com/v1"
    optional: true

  - id: llm_api_key
    type: secret
    name: "LLM API Key"
    description: "API key for the online AI features (quiz/explain/story). Leave empty to disable"
    default_value: ""
    optional: true

  - id: llm_model
    type: string
    name: "LLM Model"
    description: "Model name for the LLM API (e.g. gpt-4o-mini)"
    default_value: "gpt-4o-mini"
    optional: true

  - id: dashscope_api_key
    type: secret
    name: "DashScope API Key"
    description: "Alibaba DashScope key for free TTS voice and image generation. Leave empty to disable"
    default_value: ""
    optional: true

  - id: gemini_api_key
    type: secret
    name: "Gemini API Key"
    description: "Google Gemini key (alternative AI provider). Leave empty to disable"
    default_value: ""
    optional: true

  - id: tts_voice
    type: string
    name: "TTS Voice"
    description: "DashScope CosyVoice voice name"
    default_value: "longxiaochun"
    optional: true

  - id: tts_model
    type: string
    name: "TTS Model"
    description: "DashScope TTS model name"
    default_value: "cosyvoice-v1"
    optional: true

